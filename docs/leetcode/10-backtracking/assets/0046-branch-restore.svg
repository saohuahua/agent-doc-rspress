<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="820" viewBox="0 0 1120 820" role="img" aria-labelledby="title desc"><title id="title">全排列 分支选择与状态恢复</title><desc id="desc">输入一和二 从空路径分别探索一二和二一 每次返回弹出路径最后元素并恢复对应使用标记 答案保存副本 不受撤销影响</desc><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#b45309"/></marker></defs><rect width="1120" height="820" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#172033"><text x="40" y="47" font-size="28" fill="#172033">0046 全排列：完成一个分支后恢复到相同前缀</text><text x="40" y="84" font-size="20" fill="#172033">输入 nums = [1, 2]　used 按原下标排列　F = false　T = true</text><rect x="430" y="110" width="260" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="465" y="144" font-size="22" fill="#172033">path = []</text><text x="465" y="178" font-size="22" fill="#172033">used = [F, F]</text><rect x="100" y="300" width="300" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="135" y="334" font-size="22" fill="#172033">path = [1]</text><text x="135" y="368" font-size="22" fill="#172033">used = [T, F]</text><rect x="720" y="300" width="300" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="755" y="334" font-size="22" fill="#172033">path = [2]</text><text x="755" y="368" font-size="22" fill="#172033">used = [F, T]</text><rect x="100" y="496" width="300" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="135" y="530" font-size="22" fill="#172033">path = [1, 2]</text><text x="135" y="564" font-size="22" fill="#172033">used = [T, T]</text><rect x="720" y="496" width="300" height="86" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="755" y="530" font-size="22" fill="#172033">path = [2, 1]</text><text x="755" y="564" font-size="22" fill="#172033">used = [T, T]</text><g stroke="#2563eb" stroke-width="3" fill="none" marker-end="url(#b)"><path d="M465 196L285 298"/><path d="M655 196L840 298"/><path d="M220 386L220 493"/><path d="M840 386L840 493"/></g><g stroke="#b45309" stroke-width="3" stroke-dasharray="7 5" fill="none" marker-end="url(#o)"><path d="M290 496L290 389"/><path d="M340 300L505 198"/><path d="M910 496L910 389"/></g><text x="153" y="239" font-size="20" fill="#2563eb">① 选择 nums[0] = 1</text><text x="734" y="239" font-size="20" fill="#2563eb">⑤ 选择 nums[1] = 2</text><text x="40" y="440" font-size="20" fill="#2563eb">② 选择 2</text><text x="682" y="440" font-size="20" fill="#2563eb">⑥ 选择 1</text><text x="309" y="420" font-size="19" fill="#92400e">③ pop</text><text x="309" y="449" font-size="19" fill="#92400e">used[1] = F</text><text x="525" y="246" font-size="19" fill="#92400e">④ pop</text><text x="525" y="275" font-size="19" fill="#92400e">used[0] = F</text><text x="929" y="420" font-size="19" fill="#92400e">⑦ pop</text><text x="929" y="449" font-size="19" fill="#92400e">used[0] = F</text><text x="110" y="625" font-size="19" fill="#166534">复制保存 [1, 2]，随后执行③</text><text x="730" y="625" font-size="19" fill="#166534">复制保存 [2, 1]，随后执行⑦</text><rect x="40" y="661" width="1040" height="116" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="60" y="694" font-size="20" fill="#172033">①②深入首个分支 → 保存副本 → ③④恢复空路径 → ⑤⑥进入另一分支</text><text x="60" y="729" font-size="20" fill="#172033">⑦之后还需撤销根层的选择 2，最终恢复 path = []、used = [F, F]</text><text x="60" y="760" font-size="18" fill="#172033">图例：蓝色实线为选择并递归　橙色虚线为返回并撤销　result 不随 path 撤销</text></g></svg>