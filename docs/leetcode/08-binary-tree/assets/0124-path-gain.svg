<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="760" viewBox="0 0 1120 760" role="img" aria-labelledby="title desc"><title id="title">最大路径和 完整候选与单侧贡献</title><desc id="desc">根为负十 左孩子九 右孩子二十 二十的孩子为十五和七 完整候选四十二 单侧贡献三十五 根的候选三十四 全局答案四十二</desc><defs><marker id="b" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#2563eb"/></marker><marker id="o" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto"><path d="M0 0L10 5L0 10" fill="#b45309"/></marker></defs><rect width="1120" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif" fill="#172033"><text x="40" y="48" font-size="28" fill="#172033">0124 最大路径和：候选答案与父节点可用信息</text><text x="40" y="84" font-size="20" fill="#172033">处理顺序：9 → 15 → 7 → 20 → −10　先完成孩子，再结算父节点</text><path d="M230 155L125 265M230 155L380 265M380 265L300 390M380 265L460 390" fill="none" stroke="#94a3b8" stroke-width="3"/><path d="M300 390L380 265L460 390" fill="none" stroke="#16a34a" stroke-width="9"/><path d="M356 248L250 171" fill="none" stroke="#2563eb" stroke-width="3" stroke-dasharray="9 6" marker-end="url(#b)"/><circle cx="230" cy="155" r="31" fill="white" stroke="#64748b" stroke-width="2"/><text x="230" y="163" text-anchor="middle" font-size="24">−10</text><circle cx="125" cy="265" r="31" fill="white" stroke="#64748b" stroke-width="2"/><text x="125" y="273" text-anchor="middle" font-size="24">9</text><circle cx="380" cy="265" r="31" fill="white" stroke="#64748b" stroke-width="2"/><text x="380" y="273" text-anchor="middle" font-size="24">20</text><circle cx="300" cy="390" r="31" fill="white" stroke="#64748b" stroke-width="2"/><text x="300" y="398" text-anchor="middle" font-size="24">15</text><circle cx="460" cy="390" r="31" fill="white" stroke="#64748b" stroke-width="2"/><text x="460" y="398" text-anchor="middle" font-size="24">7</text><text x="88" y="325" font-size="20" fill="#172033">gain = 9</text><text x="233" y="449" font-size="20" fill="#172033">gain = 15</text><text x="427" y="449" font-size="20" fill="#172033">gain = 7</text><text x="305" y="184" font-size="20" fill="#2563eb">向父提供 35</text><rect x="570" y="120" width="510" height="165" rx="8" fill="#f0fdf4" stroke="#cbd5e1"/><text x="592" y="155" font-size="22" fill="#172033">① 在节点 20 结算完整候选</text><text x="592" y="194" font-size="21" fill="#172033">left = 15　right = 7</text><text x="592" y="233" font-size="21" fill="#172033">20 + 15 + 7 = 42　更新 best = 42</text><text x="592" y="266" font-size="18" fill="#172033">绿色实线表示此候选经过的两条树边</text><rect x="570" y="305" width="510" height="165" rx="8" fill="#eff6ff" stroke="#cbd5e1"/><text x="592" y="340" font-size="22" fill="#172033">② 记录节点 20 的单侧贡献</text><text x="592" y="379" font-size="21" fill="#172033">gain(20) = 20 + max(15, 7) = 35</text><text x="592" y="419" font-size="20" fill="#172033">可接父节点的链为 20 → 15</text><text x="592" y="452" font-size="18" fill="#172033">蓝色虚线表示信息回传，不是新增树边</text><rect x="40" y="505" width="1040" height="145" rx="8" fill="#f8fafc" stroke="#cbd5e1"/><text x="62" y="540" font-size="22" fill="#172033">③ 在根 −10 结算</text><text x="62" y="580" font-size="21" fill="#172033">完整候选：−10 + 9 + 35 = 34　　单侧贡献：−10 + max(9, 35) = 25</text><text x="62" y="619" font-size="21" fill="#172033">best 保持 42：全局最优路径留在右子树内部，不必经过根</text><text x="40" y="692" font-size="20" fill="#172033">若将 42 继续连接父节点，节点 20 将同时连接三条边，不再是一条简单路径</text><text x="40" y="727" font-size="18" fill="#172033">gain 对应代码 gains 表内的值；ready 标记保证读取孩子贡献时，孩子已完成结算</text></g></svg>