<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="780" viewBox="0 0 1160 780" role="img" aria-labelledby="title desc"><title id="title">数据流中位数：插入 3 后移动边界恢复平衡</title><desc id="desc">已有数字一和二时两堆等量 插入三进入较大半区 把该半区最小值二移入较小半区 恢复左侧多一的条件 中位数为二</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566679"/></marker></defs><rect width="1160" height="780" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#202e3d"><text x="42" y="52" font-size="29" font-weight="700">数据流中位数：插入 3 后恢复两半平衡</text><text x="42" y="91" >图中元素按数值排列以便阅读  不代表堆数组内部整体有序</text><text x="284" y="138" >lower 较小半区 · 最大堆</text><text x="701" y="138" >upper 较大半区 · 最小堆</text><text x="42" y="209" >① 插入前</text><rect x="260" y="160" width="355" height="90" rx="12" fill="#edf4ff" stroke="#b9c5d1"/><rect x="675" y="160" width="355" height="90" rx="12" fill="#eef8f2" stroke="#b9c5d1"/><circle cx="310" cy="203" r="27" fill="white" stroke="#4b6d9c" stroke-width="2"/><text x="310" y="211" text-anchor="middle" font-size="25">1</text><circle cx="725" cy="203" r="27" fill="white" stroke="#438568" stroke-width="2"/><text x="725" y="211" text-anchor="middle" font-size="25">2</text><text x="260" y="285" >数量相等  中位数 = (1 + 2) / 2 = 1.5</text><text x="42" y="374" >② 加入 3</text><rect x="260" y="325" width="355" height="90" rx="12" fill="#edf4ff" stroke="#b9c5d1"/><rect x="675" y="325" width="355" height="90" rx="12" fill="#eef8f2" stroke="#b9c5d1"/><circle cx="310" cy="368" r="27" fill="white" stroke="#4b6d9c" stroke-width="2"/><text x="310" y="376" text-anchor="middle" font-size="25">1</text><circle cx="725" cy="368" r="27" fill="white" stroke="#438568" stroke-width="2"/><text x="725" y="376" text-anchor="middle" font-size="25">2</text><circle cx="825" cy="368" r="27" fill="white" stroke="#438568" stroke-width="2"/><text x="825" y="376" text-anchor="middle" font-size="25">3</text><text x="260" y="450" >3 大于 lower 堆顶 1  进入 upper 后右侧多一项</text><text x="42" y="539" >③ 调整后</text><rect x="260" y="490" width="355" height="90" rx="12" fill="#edf4ff" stroke="#b9c5d1"/><rect x="675" y="490" width="355" height="90" rx="12" fill="#eef8f2" stroke="#b9c5d1"/><circle cx="310" cy="533" r="27" fill="white" stroke="#4b6d9c" stroke-width="2"/><text x="310" y="541" text-anchor="middle" font-size="25">1</text><circle cx="410" cy="533" r="27" fill="white" stroke="#4b6d9c" stroke-width="2"/><text x="410" y="541" text-anchor="middle" font-size="25">2</text><circle cx="725" cy="533" r="27" fill="white" stroke="#438568" stroke-width="2"/><text x="725" y="541" text-anchor="middle" font-size="25">3</text><text x="260" y="615" >将 upper 最小值 2 移入 lower  中位数 = 2</text><rect x="42" y="663" width="1076" height="82" rx="12" fill="#f7f8fa" stroke="#b9c5d1"/><text x="60" y="695" >读取规则：lower 比 upper 多一项时取 lower 堆顶  两边等量时取两个堆顶的平均值</text><text x="60" y="726" >移动边界值的原因：2 是右侧最小值  移动后仍有 lower 全部元素 ≤ upper 全部元素</text></g></svg>