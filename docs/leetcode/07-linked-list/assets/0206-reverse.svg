<svg xmlns="http://www.w3.org/2000/svg" width="960" height="467" viewBox="0 0 960 467" role="img" aria-labelledby="title desc"><title id="title">反转链表 一轮中三个动作的顺序</title><desc id="desc">先保留节点2的原后继3 再令2指向1 最后previous指向2 current指向3</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34577a"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#223344;font-size:21px}.title{font-size:27px;font-weight:700}.small{font-size:18px}.label{font-size:20px;font-weight:600}.box{fill:#edf3f8;stroke:#91a7bb;stroke-width:2}.active{fill:#e1f1e8;stroke:#4d8b68;stroke-width:2}.arrow{stroke:#34577a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="960" height="467" fill="#fffdf9"/><text x="32" y="44" class="title">反转链表 一轮中三个动作的顺序</text><text x="32" y="82" class="small">处理节点 2 时 先保存原后继 再改箭头 最后移动两个工作指针</text><text x="32" y="148" class="label">保存后继</text><rect x="170" y="117" width="66" height="50" rx="8" class="box"/><text x="203" y="150" text-anchor="middle">1</text><rect x="330" y="117" width="66" height="50" rx="8" class="active"/><text x="363" y="150" text-anchor="middle">2</text><rect x="490" y="117" width="66" height="50" rx="8" class="box"/><text x="523" y="150" text-anchor="middle">3</text><text x="85" y="149" class="small"></text><path d="M170 142 H135" class="arrow"/><text x="103" y="178" class="small">null</text><path d="M396 142 H488" class="arrow"/><text x="620" y="141" class="small">previous → 1　current → 2</text><text x="620" y="168" class="small">next 保存节点 3</text><text x="32" y="250" class="label">反转连接</text><rect x="170" y="219" width="66" height="50" rx="8" class="box"/><text x="203" y="252" text-anchor="middle">1</text><rect x="330" y="219" width="66" height="50" rx="8" class="active"/><text x="363" y="252" text-anchor="middle">2</text><rect x="490" y="219" width="66" height="50" rx="8" class="box"/><text x="523" y="252" text-anchor="middle">3</text><text x="85" y="251" class="small"></text><path d="M170 244 H135" class="arrow"/><text x="103" y="280" class="small">null</text><path d="M330 244 H238" class="arrow"/><text x="620" y="243" class="small">current.next → previous</text><text x="620" y="270" class="small">next 仍然保住节点 3</text><text x="32" y="352" class="label">推进状态</text><rect x="170" y="321" width="66" height="50" rx="8" class="box"/><text x="203" y="354" text-anchor="middle">1</text><rect x="330" y="321" width="66" height="50" rx="8" class="active"/><text x="363" y="354" text-anchor="middle">2</text><rect x="490" y="321" width="66" height="50" rx="8" class="box"/><text x="523" y="354" text-anchor="middle">3</text><text x="85" y="353" class="small"></text><path d="M170 346 H135" class="arrow"/><text x="103" y="382" class="small">null</text><path d="M330 346 H238" class="arrow"/><text x="620" y="345" class="small">previous → 2　current → 3</text><text x="620" y="372" class="small">下一轮继续处理节点 3</text><text x="32" y="441" class="small">图省略节点 3 指向 null 的固定连接  所有数字是节点值 箭头表示引用</text></svg>
