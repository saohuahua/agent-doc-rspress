<svg xmlns="http://www.w3.org/2000/svg" width="960" height="440" viewBox="0 0 960 440" role="img" aria-labelledby="title desc"><title id="title">不同路径 从最后一步推导状态依赖</title><desc id="desc">三乘三网格的路线计数 首行首列为一 其余格等于上方与左方之和 终点为六</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34577a"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#223344;font-size:21px}.title{font-size:27px;font-weight:700}.small{font-size:18px}.label{font-size:20px;font-weight:600}.box{fill:#edf3f8;stroke:#91a7bb;stroke-width:2}.active{fill:#e1f1e8;stroke:#4d8b68;stroke-width:2}.arrow{stroke:#34577a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="960" height="440" fill="#fffdf9"/><text x="32" y="44" class="title">不同路径 从最后一步推导状态依赖</text><text x="32" y="82" class="small">每格记录到达它的路线数 只能向右或向下 所以来源只有上方与左方</text><rect x="100" y="117" width="78" height="50" rx="8" class="box"/><text x="139" y="150" text-anchor="middle">1</text><rect x="215" y="117" width="78" height="50" rx="8" class="box"/><text x="254" y="150" text-anchor="middle">1</text><rect x="330" y="117" width="78" height="50" rx="8" class="box"/><text x="369" y="150" text-anchor="middle">1</text><rect x="100" y="207" width="78" height="50" rx="8" class="box"/><text x="139" y="240" text-anchor="middle">1</text><rect x="215" y="207" width="78" height="50" rx="8" class="box"/><text x="254" y="240" text-anchor="middle">2</text><rect x="330" y="207" width="78" height="50" rx="8" class="box"/><text x="369" y="240" text-anchor="middle">3</text><rect x="100" y="297" width="78" height="50" rx="8" class="box"/><text x="139" y="330" text-anchor="middle">1</text><rect x="215" y="297" width="78" height="50" rx="8" class="box"/><text x="254" y="330" text-anchor="middle">3</text><rect x="330" y="297" width="78" height="50" rx="8" class="active"/><text x="369" y="330" text-anchor="middle">6</text><path d="M369 258 V294" class="arrow"/><path d="M293 322 H327" class="arrow"/><text x="470" y="158" class="label">第一行与第一列都只有一种走法</text><text x="470" y="203">中间格 2 = 上方 1 + 左方 1</text><text x="470" y="248">终点格 6 = 上方 3 + 左方 3</text><text x="470" y="304" class="small">先算依赖格 再算当前格</text><text x="470" y="339" class="small">两类路线按最后一步区分 不重复计数</text><text x="32" y="408" class="small">表中的数是路线数量 不是步数 不是格子代价 也不是一条实际路径</text></svg>
