<svg xmlns="http://www.w3.org/2000/svg" width="1160" height="760" viewBox="0 0 1160 760" role="img" aria-labelledby="title desc"><title id="title">编辑距离：从三个已知前缀状态计算 ab 到 ac</title><desc id="desc">当前状态为原前缀ab变成目标前缀ac 上方删除候选为二 左方插入候选为二 左上替换候选为一 三个候选取最小得到一</desc><defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#566679"/></marker></defs><rect width="1160" height="760" fill="white"/><g font-family="Microsoft YaHei, Noto Sans CJK SC, sans-serif" font-size="21" fill="#202e3d"><text x="42" y="52" font-size="29" font-weight="700">编辑距离：计算 ab → ac 的最少操作次数</text><text x="42" y="93" >cost[i][j]：原串前 i 个字符 → 目标串前 j 个字符的最少编辑次数</text><rect x="55" y="170" width="240" height="125" rx="12" fill="#edf4ff" stroke="#b9c5d1"/><text x="75" y="215" >cost[1][1] = 0</text><text x="75" y="256" >a → a</text><rect x="365" y="170" width="240" height="125" rx="12" fill="#edf4ff" stroke="#b9c5d1"/><text x="385" y="215" >cost[1][2] = 1</text><text x="385" y="256" >a → ac</text><rect x="55" y="415" width="240" height="125" rx="12" fill="#edf4ff" stroke="#b9c5d1"/><text x="75" y="460" >cost[2][1] = 1</text><text x="75" y="501" >ab → a</text><rect x="365" y="415" width="240" height="125" rx="12" fill="#eef8f2" stroke="#b9c5d1"/><text x="385" y="460" >cost[2][2] = 1</text><text x="385" y="501" >ab → ac</text><path d="M485 303 L485 403" fill="none" stroke="#566679" stroke-width="3" marker-end="url(#arrow)"/><text x="500" y="354" >①</text><path d="M302 477 L353 477" fill="none" stroke="#566679" stroke-width="3" marker-end="url(#arrow)"/><text x="316" y="455" >②</text><path d="M270 303 L387 403" fill="none" stroke="#566679" stroke-width="3" marker-end="url(#arrow)"/><text x="310" y="350" >③</text><text x="670" y="191" font-weight="700">① 删除原串末尾 b</text><text x="670" y="226" >先删除原末尾 b  再将 a 变成 ac</text><text x="670" y="260" >cost[1][2] + 1 = 2</text><text x="670" y="327" font-weight="700">② 插入目标末尾 c</text><text x="670" y="362" >先将 ab 变成 a  再插入 c</text><text x="670" y="396" >cost[2][1] + 1 = 2</text><text x="670" y="463" font-weight="700">③ 将末尾 b 替换为 c</text><text x="670" y="498" >前缀 a → a 无需操作  再替换</text><text x="670" y="532" >cost[1][1] + 1 = 1</text><rect x="42" y="590" width="1076" height="124" rx="12" fill="#f7f8fa" stroke="#b9c5d1"/><text x="60" y="627" >结果：min(2, 2, 1) = 1  对应将 b 替换为 c</text><text x="60" y="662" >蓝色为已计算的前缀状态  绿色为当前状态  箭头表示计算依赖</text><text x="60" y="697" >三个箭头表示互相比较的候选方案  不表示需要连续执行三种操作</text></g></svg>