<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="880" viewBox="0 0 1200 880" role="img" aria-labelledby="title desc"><title id="title">滑动窗口最大值：过期删除与支配淘汰</title><desc id="desc">输入1 3 负1 负3 5，窗口长度3。右端为3时队列下标1 2 3，右端移动至4后先删除过期下标1，再从尾部删除被5支配的下标3和2，加入下标4后输出5。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52637a"/></marker></defs><rect width="1200" height="880" fill="white"/><g font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#172b46"><text x="40" y="49" font-size="30" fill="#172b46">滑动窗口最大值：两种删除对应不同依据</text><text x="40" y="89" font-size="20" fill="#172b46">nums = [1, 3, −1, −3, 5]    k = 3    单元格格式：下标 : 数值</text><text x="40" y="132" font-size="19" fill="#172b46">蓝色：仍有效的候选    红色：本步删除    绿色：本轮新元素    箭头：处理顺序</text><rect x="40" y="160" width="1110" height="148" rx="10" fill="#f6f8fb"/><text x="60" y="191" font-size="23" fill="#172b46">① 已处理 right = 3</text><text x="60" y="225" font-size="19" fill="#172b46">窗口下标 [1, 3]，元素 [3, −1, −3]，当前最大值为 3</text><rect x="70" y="241" width="144" height="46" rx="5" fill="#ddecff" stroke="#8798ad"/><text x="92" y="272" font-size="22" fill="#172b46">1 : 3</text><rect x="234" y="241" width="144" height="46" rx="5" fill="#ddecff" stroke="#8798ad"/><text x="256" y="272" font-size="22" fill="#172b46">2 : −1</text><rect x="398" y="241" width="144" height="46" rx="5" fill="#ddecff" stroke="#8798ad"/><text x="420" y="272" font-size="22" fill="#172b46">3 : −3</text><text x="580" y="261" font-size="18" fill="#172b46">下标递增，数值递减；较小元素仍可能在前项过期后成为</text><text x="580" y="286" font-size="18" fill="#172b46">最大值</text><line x1="1100" y1="310" x2="1100" y2="328" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="330" width="1110" height="148" rx="10" fill="#f6f8fb"/><text x="60" y="361" font-size="23" fill="#172b46">② 右端移动至 4：先检查过期</text><text x="60" y="395" font-size="19" fill="#172b46">新窗口左端 = 4 − 3 + 1 = 2，所以下标 1 已离开窗口</text><rect x="70" y="411" width="144" height="46" rx="5" fill="#ffe0df" stroke="#8798ad"/><text x="92" y="442" font-size="22" fill="#172b46">1 : 3</text><rect x="234" y="411" width="144" height="46" rx="5" fill="#ddecff" stroke="#8798ad"/><text x="256" y="442" font-size="22" fill="#172b46">2 : −1</text><rect x="398" y="411" width="144" height="46" rx="5" fill="#ddecff" stroke="#8798ad"/><text x="420" y="442" font-size="22" fill="#172b46">3 : −3</text><text x="580" y="431" font-size="18" fill="#172b46">删除队头下标 1 的原因是过期，与新元素 5 的大</text><text x="580" y="456" font-size="18" fill="#172b46">小无关</text><line x1="1100" y1="480" x2="1100" y2="498" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="500" width="1110" height="148" rx="10" fill="#f6f8fb"/><text x="60" y="531" font-size="23" fill="#172b46">③ 从队尾淘汰候选（绿色元素待入队）</text><text x="60" y="565" font-size="19" fill="#172b46">新元素 5 大于 −3 和 −1，且下标 4 更晚离开未来窗口</text><rect x="70" y="581" width="144" height="46" rx="5" fill="#ffe0df" stroke="#8798ad"/><text x="92" y="612" font-size="22" fill="#172b46">2 : −1</text><rect x="234" y="581" width="144" height="46" rx="5" fill="#ffe0df" stroke="#8798ad"/><text x="256" y="612" font-size="22" fill="#172b46">3 : −3</text><rect x="398" y="581" width="144" height="46" rx="5" fill="#d6f1e3" stroke="#8798ad"/><text x="420" y="612" font-size="22" fill="#172b46">4 : 5</text><text x="580" y="601" font-size="18" fill="#172b46">先删除尾部下标 3，再删除下标 2；二者均可由下标</text><text x="580" y="626" font-size="18" fill="#172b46"> 4 替代</text><line x1="1100" y1="650" x2="1100" y2="668" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"/><rect x="40" y="670" width="1110" height="148" rx="10" fill="#f6f8fb"/><text x="60" y="701" font-size="23" fill="#172b46">④ 加入当前下标并输出</text><text x="60" y="735" font-size="19" fill="#172b46">有效队列仅剩 [4]，队头对应 nums[4] = 5</text><rect x="70" y="751" width="144" height="46" rx="5" fill="#d6f1e3" stroke="#8798ad"/><text x="92" y="782" font-size="22" fill="#172b46">4 : 5</text><text x="580" y="771" font-size="18" fill="#172b46">当前窗口 [−1, −3, 5] 的最大值为 5；</text><text x="580" y="796" font-size="18" fill="#172b46">此前输出为 3、3</text><text x="40" y="851" font-size="20" fill="#172b46">实现存下标而非仅存数值：下标同时决定元素大小的查询位置与离开窗口的时刻。</text></g></svg>