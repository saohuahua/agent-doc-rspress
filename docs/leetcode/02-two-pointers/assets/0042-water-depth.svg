<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="760" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">接雨水：单列水深与前后缀最大值</title><desc id="desc">输入高度为3 0 2 0 4，蓝色表示水，灰色表示柱体。每列水深等于包含自身的左右最大值较小者减柱高，总水量为7。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10Z" fill="#52637a"/></marker></defs><rect width="1200" height="760" fill="white"/><g font-family="Microsoft YaHei, sans-serif" font-size="20" fill="#172b46"><text x="40" y="48" font-size="30" fill="#172b46">接雨水：先确定水面，再扣除柱体</text><text x="40" y="88" font-size="20" fill="#172b46">输入 height = [3, 0, 2, 0, 4]    每列宽度为 1</text><rect x="760" y="125" width="395" height="270" rx="12" fill="#f3f6fa"/><text x="785" y="164" font-size="24" fill="#172b46">位置 2 的计算</text><text x="785" y="211" font-size="20" fill="#172b46">左侧最高值 = 3</text><text x="785" y="250" font-size="20" fill="#172b46">右侧最高值 = 4</text><text x="785" y="289" font-size="20" fill="#172b46">水面高度 = min(3, 4) = 3</text><text x="785" y="328" font-size="20" fill="#172b46">柱体高度 = 2</text><text x="785" y="369" font-size="22" fill="#006b9e">水深 = 3 − 2 = 1</text><line x1="100" y1="365" x2="690" y2="365" stroke="#dce3eb"/><text x="62" y="372" font-size="20" fill="#172b46">0</text><line x1="100" y1="315" x2="690" y2="315" stroke="#dce3eb"/><text x="62" y="322" font-size="20" fill="#172b46">1</text><line x1="100" y1="265" x2="690" y2="265" stroke="#dce3eb"/><text x="62" y="272" font-size="20" fill="#172b46">2</text><line x1="100" y1="215" x2="690" y2="215" stroke="#dce3eb"/><text x="62" y="222" font-size="20" fill="#172b46">3</text><line x1="100" y1="165" x2="690" y2="165" stroke="#dce3eb"/><text x="62" y="172" font-size="20" fill="#172b46">4</text><rect x="120" y="215" width="88" height="150" fill="#6d7c90"/><text x="147" y="399" font-size="20" fill="#172b46">i=0</text><rect x="232" y="215" width="88" height="150" fill="#b8e6f8" stroke="#3193bb"/><text x="259" y="399" font-size="20" fill="#172b46">i=1</text><rect x="344" y="265" width="88" height="100" fill="#6d7c90"/><rect x="344" y="215" width="88" height="50" fill="#b8e6f8" stroke="#3193bb"/><text x="371" y="399" font-size="20" fill="#172b46">i=2</text><rect x="456" y="215" width="88" height="150" fill="#b8e6f8" stroke="#3193bb"/><text x="483" y="399" font-size="20" fill="#172b46">i=3</text><rect x="568" y="165" width="88" height="200" fill="#6d7c90"/><text x="595" y="399" font-size="20" fill="#172b46">i=4</text><line x1="112" y1="215" x2="654" y2="215" stroke="#007ca8" stroke-width="2" stroke-dasharray="8 6"/><text x="110" y="137" font-size="18" fill="#172b46">灰色：柱体     蓝色：储水     虚线：中间区间水面</text><line x1="755" y1="285" x2="397" y2="242" stroke="#52637a" stroke-width="2" marker-end="url(#arrow)"/><text x="40" y="463" font-size="24" fill="#172b46">预处理方向决定依赖顺序</text><rect x="40" y="490" width="1110" height="41" fill="#f0f5fa"/><text x="55" y="518" font-size="20" fill="#172b46">下标 i</text><text x="290" y="518" font-size="20" fill="#172b46">0</text><text x="470" y="518" font-size="20" fill="#172b46">1</text><text x="650" y="518" font-size="20" fill="#172b46">2</text><text x="830" y="518" font-size="20" fill="#172b46">3</text><text x="1010" y="518" font-size="20" fill="#172b46">4</text><rect x="40" y="531" width="1110" height="41" fill="#fff"/><text x="55" y="559" font-size="20" fill="#172b46">height[i]</text><text x="290" y="559" font-size="20" fill="#172b46">3</text><text x="470" y="559" font-size="20" fill="#172b46">0</text><text x="650" y="559" font-size="20" fill="#172b46">2</text><text x="830" y="559" font-size="20" fill="#172b46">0</text><text x="1010" y="559" font-size="20" fill="#172b46">4</text><rect x="40" y="572" width="1110" height="41" fill="#f0f5fa"/><text x="55" y="600" font-size="20" fill="#172b46">leftMax[i] →</text><text x="290" y="600" font-size="20" fill="#172b46">3</text><text x="470" y="600" font-size="20" fill="#172b46">3</text><text x="650" y="600" font-size="20" fill="#172b46">3</text><text x="830" y="600" font-size="20" fill="#172b46">3</text><text x="1010" y="600" font-size="20" fill="#172b46">4</text><rect x="40" y="613" width="1110" height="41" fill="#fff"/><text x="55" y="641" font-size="20" fill="#172b46">← rightMax[i]</text><text x="290" y="641" font-size="20" fill="#172b46">4</text><text x="470" y="641" font-size="20" fill="#172b46">4</text><text x="650" y="641" font-size="20" fill="#172b46">4</text><text x="830" y="641" font-size="20" fill="#172b46">4</text><text x="1010" y="641" font-size="20" fill="#172b46">4</text><rect x="40" y="654" width="1110" height="41" fill="#f0f5fa"/><text x="55" y="682" font-size="20" fill="#172b46">水深</text><text x="290" y="682" font-size="20" fill="#172b46">0</text><text x="470" y="682" font-size="20" fill="#172b46">3</text><text x="650" y="682" font-size="20" fill="#172b46">1</text><text x="830" y="682" font-size="20" fill="#172b46">3</text><text x="1010" y="682" font-size="20" fill="#172b46">0</text><text x="40" y="735" font-size="20" fill="#172b46">左右最大值都包含当前位置，因此水深非负；总水量 = 0 + 3 + 1 + 3 + 0 = 7。</text></g></svg>