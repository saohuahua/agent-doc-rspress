<svg xmlns="http://www.w3.org/2000/svg" width="960" height="450" viewBox="0 0 960 450" role="img" aria-labelledby="title desc"><title id="title">abba 的左边界为什么不能后退</title><desc id="desc">从ab到b再到ba 旧字符位置在当前窗口外时不能让左边界后退</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#34577a"/></marker></defs><style>text{font-family:'Microsoft YaHei','Noto Sans CJK SC',sans-serif;fill:#223344;font-size:21px}.title{font-size:27px;font-weight:700}.small{font-size:18px}.label{font-size:20px;font-weight:600}.box{fill:#edf3f8;stroke:#91a7bb;stroke-width:2}.active{fill:#e1f1e8;stroke:#4d8b68;stroke-width:2}.arrow{stroke:#34577a;stroke-width:2.5;fill:none;marker-end:url(#arrow)}</style><rect width="960" height="450" fill="#fffdf9"/><text x="32" y="44" class="title">abba 的左边界为什么不能后退</text><text x="32" y="80" class="small">绿色是当前合法区间 灰色是区间外字符 下标从零开始</text><text x="32" y="140" class="label">第 2 步</text><rect x="145" y="110" width="66" height="50" rx="8" class="active"/><text x="178" y="143" text-anchor="middle">a</text><rect x="223" y="110" width="66" height="50" rx="8" class="active"/><text x="256" y="143" text-anchor="middle">b</text><rect x="301" y="110" width="66" height="50" rx="8" class="box"/><text x="334" y="143" text-anchor="middle">b</text><rect x="379" y="110" width="66" height="50" rx="8" class="box"/><text x="412" y="143" text-anchor="middle">a</text><text x="490" y="137" class="small">读到第一个 b  区间为 ab</text><text x="490" y="164" class="small">left = 0　right = 1</text><text x="32" y="240" class="label">第 3 步</text><rect x="145" y="210" width="66" height="50" rx="8" class="box"/><text x="178" y="243" text-anchor="middle">a</text><rect x="223" y="210" width="66" height="50" rx="8" class="box"/><text x="256" y="243" text-anchor="middle">b</text><rect x="301" y="210" width="66" height="50" rx="8" class="active"/><text x="334" y="243" text-anchor="middle">b</text><rect x="379" y="210" width="66" height="50" rx="8" class="box"/><text x="412" y="243" text-anchor="middle">a</text><text x="490" y="237" class="small">再遇 b  左端越过旧 b  变成 b</text><text x="490" y="264" class="small">left = 2　right = 2</text><text x="32" y="340" class="label">第 4 步</text><rect x="145" y="310" width="66" height="50" rx="8" class="box"/><text x="178" y="343" text-anchor="middle">a</text><rect x="223" y="310" width="66" height="50" rx="8" class="box"/><text x="256" y="343" text-anchor="middle">b</text><rect x="301" y="310" width="66" height="50" rx="8" class="active"/><text x="334" y="343" text-anchor="middle">b</text><rect x="379" y="310" width="66" height="50" rx="8" class="active"/><text x="412" y="343" text-anchor="middle">a</text><text x="490" y="337" class="small">再遇 a  旧 a 已在区间外  左端不后退</text><text x="490" y="364" class="small">left = 2　right = 3</text><text x="32" y="424" class="small">最后区间是 ba  不能因为 a 曾在下标零出现 就把 left 改回一</text></svg>
